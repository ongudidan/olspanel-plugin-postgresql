# The Displayname.
name=phpPgAdmin

# The application's service.
service=both


url=/3rdparty/phppgadmin/index.php
auto_login_url=/3rdparty/phppgadmin/redirect.php?auto_login=1

# pass paramter with header
header[HTTP_AUTOLOGINUSER]=%dbusername%
header[HTTP_AUTOLOGINPASS]=%dbuserpass%

# System user and group to run process as
user=nobody
group=nogroup

# Features required

features=database

# Media  required
icon=/media/icon/phppgadmin.png

#short
sorder=99

#hide from display
display_hide=true

