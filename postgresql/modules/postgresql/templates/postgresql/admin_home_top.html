<style>
/* --- PostgreSQL Module Loader Only (No Conflict) --- */
.pgsql-loader {
  border: 2px solid #f3f3f3;
  border-top: 2px solid #4CAF50;
  border-radius: 50%;
  width: 14px;
  height: 14px;
  animation: pgsql-spin 1s linear infinite;
  display: inline-block;
  vertical-align: middle;
  margin-left: 6px;
}

@keyframes pgsql-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

 <div class="col-xl-3 col-sm-6">
                      <div class="card card-default">
                        <div class="card-header">
                          <h2 id="pg-count">
						  Loading... <span class="pgsql-loader"></span>
						  
						  </h2>
                          
                          <div class="sub-title">
                            <span class="mr-1">PostgreSQL Database</span> 
                            
                          </div>
                        </div>
                         </div>
                    </div>

<div class="col-xl-3 col-sm-6">
                      <div class="card card-default">
                        <div class="card-header">
                          <h2 id="pg-disk">
						  Loading... <span class="pgsql-loader"></span>
						  
						  </h2>
                          
                          <div class="sub-title">
                            <span class="mr-1">PostgreSQL Disk</span> 
                            
                          </div>
                        </div>
                         </div>
                    </div>


<script>
document.addEventListener("DOMContentLoaded", function() {
  fetch("/module/postgresql/admin_home/?format=json")
    .then(response => response.json())
    .then(data => {
      // Replace loader with live data
      document.getElementById("pg-count").innerHTML =
        `${data.pdb_count}`;
 document.getElementById("pg-disk").innerHTML =
        `${data.pdbsize}`;
      
    })
    .catch(err => {
      document.getElementById("pg-count").innerHTML =
        "<span style='color:red'>Error loading</span>";
		 document.getElementById("pg-disk").innerHTML =
        "<span style='color:red'>Error loading</span>";
      
    });
});
</script>
