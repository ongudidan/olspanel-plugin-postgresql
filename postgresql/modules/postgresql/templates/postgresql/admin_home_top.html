<style>
.pgsql-loader {
  border: 2px solid #e2e8f0;
  border-top: 2px solid var(--brand-color, #ef6d19);
  border-radius: 50%;
  width: 11px;
  height: 11px;
  animation: pgsql-spin 0.8s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
@keyframes pgsql-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

<!-- PostgreSQL Databases -->
<div class="flex items-center justify-between py-1.5 border-t border-slate-100 text-xs">
    <span class="text-slate-500 font-medium">PostgreSQL Databases</span>
    <span id="pg-count" class="font-mono text-slate-800 text-[11px] font-semibold">
        {% if pkg_data %}{{ pkg_data.pdb_count|default:"0" }}{% else %}<span class="pgsql-loader"></span>{% endif %}
    </span>
</div>

<!-- PostgreSQL Disk -->
<div class="flex items-center justify-between py-1.5 border-t border-slate-100 text-xs">
    <span class="text-slate-500 font-medium">PostgreSQL Disk</span>
    <span id="pg-disk" class="font-mono text-slate-800 text-[11px] font-semibold">
        {% if pkg_data %}{{ pkg_data.pdbsize|default:"0.00 bytes" }}{% else %}<span class="pgsql-loader"></span>{% endif %}
    </span>
</div>

<script>
(function() {
  function loadPgAdminStats() {
    fetch("/module/postgresql/admin_home/?format=json")
      .then(response => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(data => {
        const countEl = document.getElementById("pg-count");
        const diskEl = document.getElementById("pg-disk");
        if (countEl) countEl.textContent = (data && data.pdb_count !== undefined) ? data.pdb_count : '0';
        if (diskEl) diskEl.textContent = (data && data.pdbsize !== undefined) ? data.pdbsize : '0.00 bytes';
      })
      .catch(err => {
        const countEl = document.getElementById("pg-count");
        const diskEl = document.getElementById("pg-disk");
        if (countEl && countEl.querySelector('.pgsql-loader')) countEl.innerHTML = "<span class='text-slate-400'>0</span>";
        if (diskEl && diskEl.querySelector('.pgsql-loader')) diskEl.innerHTML = "<span class='text-slate-400'>0.00 bytes</span>";
      });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadPgAdminStats);
  } else {
    loadPgAdminStats();
  }
})();
</script>
