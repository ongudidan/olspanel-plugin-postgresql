<style>
.pgsql-loader {
  border: 2px solid #e2e8f0;
  border-top: 2px solid var(--brand-color, #ef6d19);
  border-radius: 50%;
  width: 11px;
  height: 11px;
  animation: pgsql-spin 0.8s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
@keyframes pgsql-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

<div class="flex items-center justify-between py-1.5 border-t border-slate-100 text-xs gap-2">
    <span class="text-slate-500 font-medium">PostgreSQL Databases</span>
    <span id="pg-dbcount" class="font-mono text-slate-800 text-[11px] font-semibold">
        {% if pkg_data %}{{ pkg_data.pdatabases_use }} / {{ pkg_data.pdatabases }}{% else %}<span class="pgsql-loader"></span>{% endif %}
    </span>
</div>

<div class="flex items-center justify-between py-1.5 border-t border-slate-100 text-xs gap-2">
    <span class="text-slate-500 font-medium">PostgreSQL Disk</span>
    <span id="pg-disk" class="font-mono text-slate-800 text-[11px] font-semibold">
        {% if pkg_data %}{{ pkg_data.pdisk_use_db }} / {{ pkg_data.pdisk_space }}{% else %}<span class="pgsql-loader"></span>{% endif %}
    </span>
</div>

<script>
(function() {
  function loadPgUserStats() {
    fetch("/module/postgresql/home/?format=json")
      .then(response => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(data => {
        const dbEl = document.getElementById("pg-dbcount");
        const diskEl = document.getElementById("pg-disk");
        if (dbEl) dbEl.textContent = `${data.pdatabases_use} / ${data.pdatabases}`;
        if (diskEl) {
          if (!data.pdisk_space || data.pdisk_space === 'Unlimited') {
            diskEl.textContent = `${data.pdisk_use_db} / Unlimited`;
          } else if (typeof data.pdisk_space === 'string' && (data.pdisk_space.includes('MB') || data.pdisk_space.includes('GB'))) {
            diskEl.textContent = `${data.pdisk_use_db} / ${data.pdisk_space}`;
          } else {
            diskEl.textContent = `${data.pdisk_use_db} / ${data.pdisk_space} MB`;
          }
        }
      })
      .catch(err => {
        const dbEl = document.getElementById("pg-dbcount");
        const diskEl = document.getElementById("pg-disk");
        if (dbEl && dbEl.querySelector('.pgsql-loader')) dbEl.innerHTML = "<span class='text-slate-400'>-</span>";
        if (diskEl && diskEl.querySelector('.pgsql-loader')) diskEl.innerHTML = "<span class='text-slate-400'>-</span>";
      });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadPgUserStats);
  } else {
    loadPgUserStats();
  }
})();
</script>
